# GENERATED from sxqib/shorts-factory (.github/workflows) by tools/sync_runner.py. Do not edit here.
# The code lives in the private repo; this public repo only runs it.
name: Case Unsealed episode

# Manual runs: a one-off Case Unsealed episode (hf/case/GUIDE.md). The video is sent to Discord;
# with "post" ticked it is also posted to @unsealedcase right away. The daily episode runs in daily-shorts.yml.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode id (folder name in data/case/)"
        required: true
        default: "demo"
      hint:
        description: "Optional: a case to cover, or another instruction"
        required: false
        default: ""
      render_only:
        description: "Only re-render an existing episode (no new writing)"
        type: boolean
        default: false
      post:
        description: "Post it to @unsealedcase now (Reel + Story)"
        type: boolean
        default: false

permissions:
  contents: write    # save the episode and data/case/history.json
  id-token: write    # Claude Code action

concurrency:
  group: case-episode
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      EP: ${{ inputs.episode }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      PUPPETEER_SKIP_DOWNLOAD: "1"
      HYPERFRAMES_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sxqib/shorts-factory
          token: ${{ secrets.FACTORY_TOKEN }}

      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system packages (the voice needs espeak-ng; HyperFrames needs ffmpeg)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng libcairo2-dev pkg-config ffmpeg

      # The same cached packages as the daily run (same key), so the voice (Kokoro) is installed once for both.
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-v1

      - name: Install Python packages (skipped when the cached ones work)
        run: |
          if ! ([ -x ~/venv/bin/python ] && ~/venv/bin/python -c "import torch, kokoro, playwright, cv2, edge_tts, cairo" 2>/dev/null); then
            rm -rf ~/venv && python -m venv ~/venv
            ~/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            ~/venv/bin/pip install -q -r requirements.txt
          fi
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          echo "KOKORO_PYTHON=$HOME/venv/bin/python" >> "$GITHUB_ENV"
          echo "PUPPETEER_EXECUTABLE_PATH=$(command -v google-chrome || command -v chromium)" >> "$GITHUB_ENV"

      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Cache HyperFrames
        uses: actions/cache@v4
        with:
          path: hf/node_modules
          key: hyperframes-${{ runner.os }}-${{ hashFiles('hf/package-lock.json') }}-v3

      - name: Install HyperFrames
        run: '[ -x hf/node_modules/.bin/hyperframes ] || (cd hf && npm ci --no-audit --no-fund)'

      - name: Write the episode (Claude Code, your Claude plan)
        if: ${{ !inputs.render_only }}
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Read hf/case/GUIDE.md and follow it exactly. Today's date is the date of the run.
            This run is unattended and one-shot: run every command in the foreground and wait for it (never in the
            background, never end your turn to wait), or the episode is lost.
            The episode id is ${{ inputs.episode }}: research and pick the case, write data/case/${{ inputs.episode }}/episode.json,
            run `python -m hf.case voice ${{ inputs.episode }}`, get pictures with `python -m hf.case search` and
            `python -m hf.case image ${{ inputs.episode }} ...`, write data/case/${{ inputs.episode }}/index.html,
            and check it with `python -m hf.case preview ${{ inputs.episode }}` (look at EVERY contact sheet it prints)
            until it has 0 errors and every shot looks right.
            Don't edit any other files. Don't render and don't commit.
            ${{ inputs.hint }}
          show_full_output: false
          claude_args: >-
            --model claude-opus-5-5
            --allowedTools "Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Bash(python -m hf.case search:*),Bash(python -m hf.case image:*),Bash(python -m hf.case voice:*),Bash(python -m hf.case preview:*),Bash(python -m hf.case cover:*)"
            --max-turns 200

      # claude-code-action points git at the repo the workflow runs in (this public runner): point it back
      - name: Point git back at the private repo
        if: always()
        env:
          FT: ${{ secrets.FACTORY_TOKEN }}
        run: |
          git remote set-url origin https://github.com/sxqib/shorts-factory
          git config --local --unset-all http.https://github.com/.extraheader || true
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$FT" | base64 -w0)"
          git config --global --unset-all url.https://x-access-token@github.com/.insteadOf 2>/dev/null || true
          git remote -v | sed 's/:[^@]*@/:***@/'
      - name: Voice (re-render of an episode that has none here yet)
        if: ${{ inputs.render_only }}
        run: '[ -f "out/case/$EP/mix.wav" ] || python -m hf.case voice "$EP"'

      - name: Render
        run: python -m hf.case build "$EP" "out/case-video/$EP/case.mp4"

      - name: Send to Discord
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from deliver import post, fit_for_discord
          ep = os.environ["EP"]
          m = json.loads(Path(f"data/case/{ep}/episode.json").read_text(encoding="utf-8"))["meta"]
          url = os.environ.get("DISCORD_WEBHOOK")
          if url:
              post(url, f"## 🔎 Case Unsealed: {m['title']}\n-# {m['case']} ({m['kind']})", file=fit_for_discord(Path(f"out/case-video/{ep}/case.mp4")))
              cv = Path(f"out/case-video/{ep}/case.cover.jpg")
              if cv.exists():
                  post(url, "-# Reel cover ⬆️", file=cv)
              post(url, f"{m['ig_caption']}\n\n{m['question']}\n\n" + " ".join("#" + h for h in m.get("hashtags", [])))
          PY

      - name: Post to @unsealedcase
        if: inputs.post
        env:
          IG_TOKEN_CRIME: ${{ secrets.IG_TOKEN_CRIME }}
          IG_TOKEN_CRIME_ID: ${{ secrets.IG_TOKEN_CRIME_ID }}
        run: |
          D="out/post/$(TZ=America/New_York date +%F)"
          mkdir -p "$D"
          cp "out/case-video/$EP/case.mp4" "$D/case.mp4"
          cp "out/case-video/$EP/case.instagram.txt" "$D/case.instagram.txt"
          cp "out/case-video/$EP/case.cover.jpg" "$D/case.cover.jpg" 2>/dev/null || true   # the Reel cover
          python ig_post.py --dir "$D"
          cp data/ig_posted.json /tmp/ig_posted.json

      - name: Save the episode (and record it)
        if: always()
        run: |
          [ -f "data/case/$EP/episode.json" ] || exit 0
          mkdir -p /tmp/keep && cp -r "data/case/$EP" /tmp/keep/ep
          [ -f /tmp/ig_posted.json ] && cp /tmp/ig_posted.json /tmp/keep/ig_posted.json || true
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p "data/case/$EP" && cp -r /tmp/keep/ep/. "data/case/$EP/"
            python - <<'PY'
          import datetime as dt, json, os
          from pathlib import Path
          ep = os.environ["EP"]
          m = json.loads(Path(f"data/case/{ep}/episode.json").read_text(encoding="utf-8"))["meta"]
          hp = Path("data/case/history.json")
          hist = json.loads(hp.read_text(encoding="utf-8")) if hp.exists() else []
          if not any(h.get("episode") == ep for h in hist):
              hist.append({"date": dt.date.today().isoformat(), "episode": ep, "case": m["case"], "kind": m["kind"],
                           "title": m["title"]})
          hp.write_text(json.dumps(hist, indent=1, ensure_ascii=False) + "\n", encoding="utf-8")
          kp = Path("/tmp/keep/ig_posted.json")
          if kp.exists():
              mine = json.loads(kp.read_text(encoding="utf-8"))
              ip = Path("data/ig_posted.json")
              cur = json.loads(ip.read_text(encoding="utf-8")) if ip.exists() else {}
              for day, entries in mine.items():
                  for k, v in entries.items():
                      cur.setdefault(day, {}).setdefault(k, v)
              ip.write_text(json.dumps(cur, indent=2) + "\n", encoding="utf-8")
          PY
            git add "data/case/$EP" data/case/history.json data/ig_posted.json
            git diff --cached --quiet && break
            git commit -q -m "Case Unsealed episode $EP" && git push -q && break
            sleep 5
          done

      - name: Keep the video privately for 7 days
        if: always()
        env:
          VAULT_TOKEN: ${{ secrets.FACTORY_TOKEN || github.token }}
        run: python tools/vault.py put "case-${{ inputs.episode }}" out/case-video/ out/case/${{ inputs.episode }}/snap/
