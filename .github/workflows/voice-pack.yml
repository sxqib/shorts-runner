# GENERATED from sxqib/shorts-factory (.github/workflows) by tools/sync_runner.py. Do not edit here.
# The code lives in the private repo; this public repo only runs it.
name: Voice pack (HyperFrames test)

# Makes the voice track for a script with the pipeline's own voice (Kokoro), plus word timings and sound
# effects, for building an episode in HyperFrames. Posts nothing.
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Name for the pack"
        required: true
      script:
        description: 'JSON list of lines, one per scene: ["line 1", "line 2"]'
        required: true

permissions:
  contents: read

jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: sxqib/shorts-factory
          token: ${{ secrets.FACTORY_TOKEN }}
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: "3.12"
      - name: Install system packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng libcairo2-dev pkg-config
      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-story-${{ runner.os }}-${{ steps.py.outputs.python-version }}-${{ hashFiles('requirements.txt') }}-v1
      - name: Install Python packages (skipped when the cached ones work)
        run: |
          if [ -x ~/venv/bin/python ] && ~/venv/bin/python -c "import torch, kokoro, cairo, cv2" 2>/dev/null; then
            echo "Using cached packages"
          else
            rm -rf ~/venv && python -m venv ~/venv
            ~/venv/bin/pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            ~/venv/bin/pip install -q -r requirements.txt pycairo
          fi
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"
          echo "KOKORO_PYTHON=$HOME/venv/bin/python" >> "$GITHUB_ENV"
      - name: Cache Kokoro voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - name: Make the voice pack
        env:
          SCRIPT: ${{ inputs.script }}
          NAME: ${{ inputs.name }}
        run: |
          printf '%s' "$SCRIPT" > /tmp/script.json
          python tools/voice_pack.py /tmp/script.json "out/voice/$NAME"
      - name: Keep the voice pack privately for 7 days
        env:
          VAULT_TOKEN: ${{ secrets.FACTORY_TOKEN || github.token }}
        run: python tools/vault.py put "voice-${{ inputs.name }}" out/voice/
