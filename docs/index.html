<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
<title>Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b6cff'/%3E%3Cpath d='M12 9l11 7-11 7z' fill='white'/%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Studio" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- sign in / first-time setup -->
  <main id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="logo"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M12 9l11 7-11 7z" fill="#fff"/></svg></div>
      <h1 id="gate-title">Studio</h1>
      <p id="gate-sub" class="muted">Enter your password.</p>
      <form id="gate-form" autocomplete="on">
        <input type="text" name="username" value="studio" autocomplete="username" hidden />
        <label class="field" id="f-token" hidden>
          <span>GitHub token</span>
          <input id="in-token" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_…" />
        </label>
        <label class="field">
          <span id="pw-label">Password</span>
          <input id="in-pw" type="password" autocomplete="current-password" required />
        </label>
        <label class="field" id="f-pw2" hidden>
          <span>Repeat password</span>
          <input id="in-pw2" type="password" autocomplete="new-password" />
        </label>
        <label class="check"><input id="in-remember" type="checkbox" checked /> <span>Remember this device</span></label>
        <button class="btn primary wide" id="gate-btn" type="submit">Unlock</button>
        <p id="gate-err" class="err" role="alert"></p>
      </form>
      <p class="fine" id="gate-help"></p>
    </div>
  </main>

  <!-- the app -->
  <div id="app" class="app" hidden>
    <nav class="nav" aria-label="Sections">
      <div class="brand"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M12 9l11 7-11 7z" fill="#fff"/></svg><span>Studio</span></div>
      <a href="#today" data-view="today"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg><span>Today</span></a>
      <a href="#create" data-view="create"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Create</span></a>
      <a href="#library" data-view="library"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="m10 9 5 3-5 3z"/></svg><span>Library</span></a>
      <a href="#channels" data-view="channels"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Channels</span></a>
      <a href="#activity" data-view="activity"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg><span>Activity</span></a>
      <button class="nav-foot" id="btn-lock" title="Lock"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Lock</span></button>
    </nav>
    <main class="main">
      <header class="top">
        <div>
          <h1 id="view-title">Today</h1>
          <p id="view-sub" class="muted"></p>
        </div>
        <button class="icon-btn" id="btn-refresh" title="Refresh"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
    </main>
  </div>

  <!-- sheet (details, video) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-bg" data-close></div>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <button class="icon-btn sheet-x" data-close title="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <div id="sheet-body"></div>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
